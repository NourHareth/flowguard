# Lint and the full test suite on every push and pull request. The tests use synthetic flows,
# so no dataset is needed. The newest Python job runs on the newest releases of every
# dependency, which is how a break like pandas 3's read-only arrays shows up early.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: python -m ruff check src tests app
      - name: Test
        run: python -m pytest
