[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.1.0"
description = "Explainable, cross-dataset, adversarially tested network intrusion detection on flow features."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "NourHareth"}]
keywords = ["intrusion detection", "machine learning", "network security", "CIC-IDS2017", "numpy"]
# Only what the code imports. Planned parts (P4, SHAP, the API and dashboard) get their
# libraries in the extras below once they are built.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
track = ["mlflow>=2.12"]          # experiment tracking; every step runs without it (tracking.py)
test = ["pytest>=8", "ruff>=0.8"]
dev = ["flowguard[test]", "jupyterlab>=4"]
all = ["flowguard[track,dev]"]
# planned, not used by any code yet
explain = ["shap>=0.45"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "streamlit>=1.33", "plotly>=5.20",
         "cicflowmeter>=0.1.9"]
dl = ["torch>=2.2"]               # comparison only: our models are pure NumPy
adv = ["adversarial-robustness-toolbox>=1.17"]

[project.urls]
Repository = "https://github.com/ihebmabroukii/flowguard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned, so `make lint` means the same thing whichever ruff version is installed.
select = ["E", "F", "W", "B", "SIM", "RUF"]
ignore = ["B905"]   # zip(strict=...) on arrays that are equal-length by construction
